<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clock</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* SCREEN CARDS */
        #lock-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 80px 0;
            z-index: 10;
            background: #000000;
            touch-action: none;
        }
        #app-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: none;
            flex-direction: column;
            padding: 60px 24px;
            z-index: 5;
        }

        /* CLOCK LAYOUT TYPOGRAPHY */
        .lock-header {
            text-align: center;
            pointer-events: none;
        }
        .lock-date {
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .lock-time {
            color: #ffffff;
            font-size: 96px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-top: -5px;
            line-height: 1.1;
        }

        /* SECRET GRID MATRIX OVERLAY */
        #secret-pad {
            position: absolute;
            bottom: 160px; 
            left: 5%;
            width: 90%;
            height: 280px; 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            z-index: 50;
            pointer-events: auto !important;
            
            /* REVERT FIX: Restored to 0.15 opacity for high performance practice targeting */
            opacity: 0.15; 
        }
        .pad-btn {
            background: rgba(255, 0, 0, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff; 
            font-size: 24px;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        /* HARDWARE GRAPHICAL ACCENTS */
        .bottom-actions {
            position: absolute;
            bottom: 45px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 15;
            pointer-events: none;
        }
        .circle-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle-btn svg {
            fill: #ffffff;
            width: 22px;
            height: 22px;
        }

        /* ALARM GRAPHICS PAGE */
        .app-header {
            color: #ffffff;
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 25px;
        }
        .alarm-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 0.5px solid #222;
        }
        .alarm-time-container {
            display: flex;
            align-items: baseline;
        }
        .alarm-time {
            color: #ffffff;
            font-size: 56px;
            font-weight: 300;
        }
        .alarm-ampm {
            color: #ffffff;
            font-size: 24px;
            margin-left: 4px;
        }
        .alarm-label {
            color: #8e8e93;
            font-size: 14px;
            margin-top: -4px;
        }

        /* NATIVE SLIDER SWITCH TOGGLE */
        .ios-switch {
            width: 51px;
            height: 31px;
            background-color: #39393d; 
            border-radius: 16px;
            position: relative;
            transition: background-color 0.2s ease;
        }
        .ios-switch::after {
            content: '';
            position: absolute;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            background-color: #ffffff;
            top: 2px;
            left: 2px;
            transition: transform 0.2s ease;
        }

        .activated {
            background-color: #34c759 !important;
        }
        .activated::after {
            transform: translateX(20px);
        }

        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 10px;
            z-index: 200;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: Fake Lock Screen -->
    <div id="lock-screen">
        <div class="lock-header">
            <div class="lock-date" id="current-date">Tue, Oct 13</div>
            <div class="lock-time" id="current-time">11:27</div>
        </div>

        <!-- 3x4 Numerical Matrix Grid Array -->
        <div id="secret-pad">
            <div class="pad-btn" data-num="1">1</div>
            <div class="pad-btn" data-num="2">2</div>
            <div class="pad-btn" data-num="3">3</div>
            <div class="pad-btn" data-num="4">4</div>
            <div class="pad-btn" data-num="5">5</div>
            <div class="pad-btn" data-num="6">6</div>
            <div class="pad-btn" data-num="7">7</div>
            <div class="pad-btn" data-num="8">8</div>
            <div class="pad-btn" data-num="9">9</div>
            <div class="pad-btn" style="visibility: hidden;"></div>
            <div class="pad-btn" data-num="0">0</div>
        </div>
        
        <div class="bottom-actions">
            <div class="circle-btn">
                <svg viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10 10 10 0 0 0 10-10A10 10 0 0 0 12 2zm0 18a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm1.5-6.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-4a1.5 1.5 0 0 1 3 0v4z"/></svg>
            </div>
            <div style="color: #ffffff; opacity: 0.6; font-size: 14px; margin-top: 15px;">Swipe up to unlock</div>
            <div class="circle-btn">
                <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: Fake Alarm Face -->
    <div id="app-screen">
        <div class="app-header">Alarm</div>
        <div class="alarm-row">
            <div>
                <div class="alarm-time-container">
                    <div class="alarm-time" id="display-time">07:00</div>
                    <div class="alarm-ampm" id="display-ampm">AM</div>
                </div>
                <div class="alarm-label">Alarm</div>
            </div>
            <div class="ios-switch" id="magic-toggle"></div>
        </div>
    </div>

    <div class="home-indicator"></div>

    <script>
        // Update Live Date display
        const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', dateOptions);
        
        function updateLockClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes().toString().padStart(2, '0');
            let standardHours = (hours % 12 === 0) ? 12 : hours % 12;
            document.getElementById('current-time').innerText = `${standardHours}:${minutes}`;
        }
        updateLockClock();
        setInterval(updateLockClock, 10000);

        let digitsEntered = [];
        let finalHour = "07";
        let finalMinute = "00";
        let finalAmPm = "AM";

        // REVERTED TOUCH BLOCK: Restored to original stable working input collection framework
        const padButtons = document.querySelectorAll('.pad-btn');
        padButtons.forEach(btn => {
            btn.addEventListener('touchstart', function(e) {
                e.stopPropagation(); 
                let num = this.getAttribute('data-num');
                if (num !== null) {
                    digitsEntered.push(num);
                    if (digitsEntered.length === 4) {
                        processMagicTime(digitsEntered);
                    }
                }
            });
        });

        // REVERTED LOGIC ENGINE: Restored exact working string logic pattern that bypasses system crashes
        function processMagicTime(array) {
            let h1 = array[0];
            let h2 = array[1];
            let m1 = array[2];
            let m2 = array[3];
            
            let rawHour = parseInt(h1 + h2, 10);
            let rawMin = m1 + m2;
            
            if (rawHour === 0) {
                finalHour = "12";
                finalAmPm = "AM";
            } else if (rawHour === 12) {
                finalHour = "12";
                finalAmPm = "PM";
            } else if (rawHour > 12) {
                finalHour = (rawHour - 12).toString().padStart(2, '0');
                finalAmPm = "PM";
            } else {
                finalHour = rawHour.toString().padStart(2, '0');
                finalAmPm = "AM";
            }
            
            finalMinute = rawMin;
            
            document.getElementById('display-time').innerText = `${finalHour}:${finalMinute}`;
            document.getElementById('display-ampm').innerText = finalAmPm;
            
            // Turn the alarm switch green instantly by default
            document.getElementById('magic-toggle').classList.add('activated');
        }

        // SWIPE MANAGER
        let startY = 0;
        document.getElementById('lock-screen').addEventListener('touchstart', (e) => {
            startY = e.touches.clientY;
        }, { passive: true });

        document.getElementById('lock-screen').addEventListener('touchend', (e) => {
            let endY = e.changedTouches.clientY;
            let swipeDistance = startY - endY;
            
            if (swipeDistance > 60) { 
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
            }
        });

        document.getElementById('magic-toggle').addEventListener('touchstart', function(e) {
            e.preventDefault();
            this.classList.toggle('activated');
        });
    </script>
</body>
</html>
